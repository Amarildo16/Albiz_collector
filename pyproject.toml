[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "albiz-collector"
version = "0.1.0"
description = "Prototype Albanian business data collection pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"APScheduler==3.10.4",
	"beautifulsoup4==4.12.3",
	"click==8.1.8",
	"httpx==0.27.0",
	"lxml==5.2.2",
	"playwright==1.52.0",
	"PyMySQL==1.1.1",
	"psycopg[binary]==3.2.13",
	"python-dotenv==1.0.1",
	"SQLAlchemy==2.0.36",
	"tenacity==9.0.0",
	"typer==0.12.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
