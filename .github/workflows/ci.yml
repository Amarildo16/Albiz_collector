name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_mysql_integration:
        description: Run the opt-in MySQL integration test job
        required: false
        type: boolean
        default: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  mysql-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mysql_integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run MySQL integration tests
        env:
          RUN_MYSQL_INTEGRATION_TESTS: "1"
          MYSQL_INTEGRATION_ADMIN_URL: mysql+pymysql://root:root@127.0.0.1:3306/mysql
        run: python -m unittest discover -s tests/integration -p "*_integration.py" -v
